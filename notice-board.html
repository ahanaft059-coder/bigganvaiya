<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>নোটিশ বোর্ড · বিজ্ঞান ভাইয়া</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
<style>
/* বিজ্ঞান ভাইয়া: রং ও ফন্ট এখানে বদলানো যাবে।
   ধারণা: রাতের আকাশের মতো গাঢ় নীল হেডার ও হিরো, তার ওপর রঙিন গ্রহের মতো আলাদা আলাদা রং।
   প্রতিটি বিষয়ের (ট্যাগ) নিজের রং আছে, আর নিচের :root-এ রংগুলো নাম ধরে সাজানো। */
:root {
  --bg: #F3F6FC;
  --bg2: #E8EEFA;
  --surface: #FFFFFF;
  --surface2: #EEF3FB;
  --fg: #0E2036;
  --muted: #4F627B;
  --line: #DAE3F0;
  --shadow: 0 1px 2px rgba(14, 32, 54, .05), 0 10px 30px rgba(14, 32, 54, .07);
  --shadow-lg: 0 2px 4px rgba(14, 32, 54, .06), 0 22px 50px rgba(14, 32, 54, .12);

  --navy: #0A1D33;
  --navy2: #123259;
  --hdr-fg: #FFFFFF;
  --hdr-muted: #C2D5EA;

  --amber: #FFB020;  --amber-ink: #8A5300;
  --coral: #F2574B;  --coral-ink: #B3261E;
  --violet: #6C4DF2; --violet-ink: #4527C9;
  --teal: #0FA392;   --teal-ink: #0A6F63;
  --sky: #1E90E8;    --sky-ink: #0B5FA6;
  --pink: #E0399A;   --pink-ink: #A81E70;
  --on-amber: #0A1D33;
  --accent: var(--amber);
  --accent-ink: var(--amber-ink);
  --font: 'Hind Siliguri', 'Noto Sans Bengali', 'Kalpurush', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071524; --bg2: #0B1E33; --surface: #0F2741; --surface2: #153356; --fg: #EAF2FB; --muted: #9FB6CE; --line: #223F63;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35); --shadow-lg: 0 2px 4px rgba(0, 0, 0, .3), 0 24px 54px rgba(0, 0, 0, .5);
    --amber-ink: #FFC24D; --coral-ink: #FF8C82; --violet-ink: #B3A1FF; --teal-ink: #52E0CF; --sky-ink: #6EC3FF; --pink-ink: #FF8ACB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #071524; --bg2: #0B1E33; --surface: #0F2741; --surface2: #153356; --fg: #EAF2FB; --muted: #9FB6CE; --line: #223F63;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35); --shadow-lg: 0 2px 4px rgba(0, 0, 0, .3), 0 24px 54px rgba(0, 0, 0, .5);
  --amber-ink: #FFC24D; --coral-ink: #FF8C82; --violet-ink: #B3A1FF; --teal-ink: #52E0CF; --sky-ink: #6EC3FF; --pink-ink: #FF8ACB;
  color-scheme: dark;
}

/* বিষয়ভেদে রং: যেকোনো উপাদানে c-xxx ক্লাস দিলে --c (মূল রং) ও --ink (লেখার রং) পাওয়া যায় */
.c-amber  { --c: var(--amber);  --ink: var(--amber-ink);  --on: var(--on-amber); }
.c-coral  { --c: var(--coral);  --ink: var(--coral-ink);  --on: #FFFFFF; }
.c-violet { --c: var(--violet); --ink: var(--violet-ink); --on: #FFFFFF; }
.c-teal   { --c: var(--teal);   --ink: var(--teal-ink);   --on: #FFFFFF; }
.c-sky    { --c: var(--sky);    --ink: var(--sky-ink);    --on: #FFFFFF; }
.c-pink   { --c: var(--pink);   --ink: var(--pink-ink);   --on: #FFFFFF; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; color: var(--fg); font-family: var(--font); font-size: 18px; line-height: 1.7;
  background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--navy); z-index: 30; }
h1, h2, h3 { line-height: 1.3; margin: 0; text-wrap: balance; }
p { margin: 0 0 .8em; }
a { color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 1080px; margin: 0 auto; }
.bleed { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 8px; }
.mono { font-variant-numeric: tabular-nums; }

/* ---------- হেডার ---------- */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; color: var(--hdr-fg); background: rgba(10, 29, 51, .88); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255, 255, 255, .08); }
.site-header .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 23px; white-space: nowrap; }
.brand .mark { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--amber), var(--coral)); color: var(--on-amber); display: grid; place-items: center; font-size: 24px; line-height: 1; box-shadow: 0 4px 14px rgba(255, 140, 60, .45); }
.hdr-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.theme-btn, .menu-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .06); color: var(--hdr-fg); cursor: pointer; display: grid; place-items: center; font-size: 18px; transition: background .15s; }
.theme-btn:hover, .menu-btn:hover { background: rgba(255, 255, 255, .14); }
.menu-btn[aria-expanded="true"] { background: var(--amber); color: var(--on-amber); border-color: var(--amber); }
.site-header .menu { position: absolute; left: 0; right: 0; top: 100%; background: rgba(10, 29, 51, .97); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 24px 40px rgba(0, 0, 0, .35); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.site-header .menu .menu-in { display: grid; align-items: stretch; gap: 0; padding-block: 8px 12px; }
.menu-in a { display: flex; align-items: center; gap: 14px; color: var(--hdr-fg); text-decoration: none; padding: 13px 4px; font-weight: 700; font-size: 20px; border-bottom: 1px solid rgba(255, 255, 255, .07); }
.menu-in a:last-child { border-bottom: 0; }
.menu-in a i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 28%, transparent); }
.menu-in a:hover { color: var(--amber); }
.menu-in a[aria-current="page"] { color: var(--amber); }

/* ---------- হিরো ---------- */
.hero { position: relative; color: #FFFFFF; overflow: hidden; isolation: isolate;
  background:
    radial-gradient(900px 480px at 85% -10%, rgba(108, 77, 242, .55), transparent 60%),
    radial-gradient(700px 420px at 0% 110%, rgba(15, 163, 146, .45), transparent 60%),
    radial-gradient(600px 400px at 50% 120%, rgba(242, 87, 75, .28), transparent 60%),
    linear-gradient(180deg, #0A1D33, #0E2A4C); }
.hero .wrap { position: relative; padding-block: 52px 64px; display: grid; gap: 16px; z-index: 2; }
.hero .eyebrow { display: inline-flex; width: fit-content; align-items: center; gap: 8px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18); color: #FFD27A; font-weight: 700; font-size: 15px; letter-spacing: 1px; padding: 4px 16px; border-radius: 999px; }
.hero h1 { font-size: clamp(50px, 11vw, 100px); font-weight: 700; letter-spacing: -.5px; background: linear-gradient(95deg, #FFD36E 0%, #FF9A62 45%, #FF6FA8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; max-width: 100%; }
.hero p.lead { font-size: clamp(20px, 3.2vw, 26px); color: #CFE0F2; max-width: 28em; margin: 0; }
.orbit { position: absolute; right: -90px; top: -70px; width: 520px; height: 520px; z-index: 1; opacity: .95; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(2px); z-index: 1; animation: drift 14s ease-in-out infinite; pointer-events: none; }
.orb.o1 { width: 18px; height: 18px; background: #FFB020; left: 8%; top: 22%; box-shadow: 0 0 24px #FFB020; }
.orb.o2 { width: 12px; height: 12px; background: #4FE3D2; left: 46%; top: 12%; box-shadow: 0 0 20px #4FE3D2; animation-delay: -4s; }
.orb.o3 { width: 22px; height: 22px; background: #FF6FA8; right: 12%; bottom: 16%; box-shadow: 0 0 28px #FF6FA8; animation-delay: -8s; }
.orb.o4 { width: 10px; height: 10px; background: #8EA2FF; left: 28%; bottom: 14%; box-shadow: 0 0 18px #8EA2FF; animation-delay: -2s; }
@keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(14px, -18px); } }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #FFC24D, #FF9A3D); color: var(--on-amber); font: inherit; font-weight: 700; padding: 11px 26px; border-radius: 999px; text-decoration: none; border: 0; cursor: pointer; box-shadow: 0 8px 22px rgba(255, 154, 61, .38); transition: transform .15s, box-shadow .15s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255, 154, 61, .5); }
.btn.ghost { background: rgba(255, 255, 255, .08); color: #FFFFFF; border: 1.5px solid rgba(255, 255, 255, .45); box-shadow: none; }
main .btn.ghost { color: var(--fg); border-color: var(--line); background: var(--surface); }

/* ---------- সেকশন ও কার্ড ---------- */
main { padding-block: 34px 64px; }
.section { margin-top: 46px; }
.section > h2, .head-row h2 { font-size: clamp(26px, 4.4vw, 32px); margin-bottom: 16px; }
.head-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.head-row h2 { margin: 0; }
.head-row a { color: var(--accent-ink); font-weight: 700; text-decoration: none; }
.head-row a:hover { text-decoration: underline; }
.page-head { position: relative; padding: 8px 0 6px; margin-bottom: 8px; }
.page-head .kicker { display: inline-block; font-weight: 700; font-size: 14px; letter-spacing: 1.2px; color: var(--ink); background: color-mix(in srgb, var(--c) 16%, transparent); border-radius: 999px; padding: 2px 14px; margin-bottom: 8px; }
.page-title { font-size: clamp(34px, 7vw, 54px); font-weight: 700; margin-bottom: 8px; }
.page-sub { color: var(--muted); max-width: 40em; margin-bottom: 22px; font-size: 19px; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.list { display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px 22px; min-width: 0; box-shadow: var(--shadow); }
.card h3 { font-size: 22px; margin-bottom: 6px; }
.card p:last-child { margin-bottom: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 15px; }
.chip { display: inline-block; background: color-mix(in srgb, var(--c, var(--muted)) 16%, transparent); color: var(--ink, var(--fg)); border-radius: 999px; padding: 1px 13px; font-size: 14px; font-weight: 700; }
.chip.solid { background: var(--c); color: var(--on); }

/* রোজকার বিজ্ঞানের কার্ড: বাঁ পাশে তারিখের রঙিন টাইল */
.post { display: grid; grid-template-columns: 76px 1fr; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.datetile { width: 76px; height: 86px; border-radius: 18px; background: linear-gradient(160deg, var(--c), color-mix(in srgb, var(--c) 65%, #000)); color: var(--on); display: grid; place-content: center; text-align: center; line-height: 1.1; box-shadow: 0 10px 22px color-mix(in srgb, var(--c) 40%, transparent); }
.datetile b { font-size: 34px; display: block; }
.datetile span { font-size: 14px; font-weight: 700; opacity: .95; }
.post h3 { font-size: 23px; margin: 6px 0 8px; }
.post .body { min-width: 0; }
.post p:last-of-type { margin-bottom: 0; }

/* আজকের বিজ্ঞান: গ্রেডিয়েন্ট বর্ডারওয়ালা বড় কার্ড */
.today { position: relative; border-radius: 28px; padding: 3px; background: linear-gradient(120deg, #FFB020, #F2574B 40%, #6C4DF2 75%, #1E90E8); box-shadow: var(--shadow-lg); }
.today-in { background: var(--surface); border-radius: 25px; padding: 28px clamp(20px, 4vw, 36px); display: grid; gap: 10px; }
.today-in h2 { font-size: clamp(28px, 5.4vw, 40px); margin: 0; }
.today-in p { font-size: 19px; }
.try { background: color-mix(in srgb, var(--c, var(--amber)) 13%, var(--surface)); border-radius: 14px; padding: 12px 16px; margin-top: 8px; border: 1px dashed color-mix(in srgb, var(--c, var(--amber)) 55%, transparent); }
.try b { color: var(--ink, var(--amber-ink)); }

/* হোমের রঙিন বিভাগ-টাইল */
.tiles { grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.tile { position: relative; overflow: hidden; text-decoration: none; display: grid; gap: 4px; align-content: end; min-height: 170px; border: 0; color: var(--on); background: linear-gradient(150deg, var(--c), color-mix(in srgb, var(--c) 55%, #000)); box-shadow: 0 16px 34px color-mix(in srgb, var(--c) 38%, transparent); transition: transform .2s, box-shadow .2s; }
.tile:hover { transform: translateY(-4px); box-shadow: 0 22px 42px color-mix(in srgb, var(--c) 50%, transparent); }
.tile .ic { position: absolute; right: 16px; top: 14px; width: 44px; height: 44px; opacity: .92; }
.tile::after { content: ""; position: absolute; right: -30px; bottom: -40px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255, 255, 255, .13); }
.tile .num { font-size: 44px; font-weight: 700; line-height: 1; }
.tile .lbl { font-weight: 700; font-size: 21px; }
.tile .hint { font-size: 15px; opacity: .92; }

/* ফিল্টার, সার্চ */
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
.search { flex: 1 1 240px; min-width: 0; font: inherit; padding: 12px 20px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.search:focus { border-color: var(--amber); outline: none; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { font: inherit; font-size: 15px; font-weight: 700; background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 16px; cursor: pointer; transition: transform .12s; }
.filters button:hover { transform: translateY(-1px); }
.filters button[aria-pressed="true"] { background: linear-gradient(135deg, #FFC24D, #FF9A3D); color: var(--on-amber); border-color: transparent; }

/* প্রশ্ন-উত্তর */
details.qa { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 22px; box-shadow: var(--shadow); }
details.qa + details.qa { margin-top: 12px; }
details.qa summary { cursor: pointer; font-weight: 700; font-size: 20px; padding: 14px 0; display: flex; align-items: center; gap: 14px; list-style: none; }
details.qa summary::-webkit-details-marker { display: none; }
details.qa summary::before { content: "?"; flex: none; width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--violet), var(--sky)); color: #FFFFFF; display: grid; place-items: center; font-size: 19px; }
details.qa summary::after { content: "+"; margin-left: auto; font-size: 26px; color: var(--muted); }
details.qa[open] summary::after { content: "−"; }
details.qa[open] summary { color: var(--violet-ink); }
details.qa .ans { padding: 0 0 16px 48px; }

ol.steps { padding-left: 1.3em; margin: 6px 0 12px; }
ol.steps li { margin-bottom: 4px; }
ul.plain { margin: 6px 0 12px; padding-left: 1.2em; }
.safety { color: var(--muted); font-size: 16px; border-top: 1px dashed var(--line); padding-top: 10px; }
.empty { border: 2px dashed var(--line); border-radius: 22px; padding: 34px 22px; text-align: center; color: var(--muted); background: color-mix(in srgb, var(--violet) 5%, var(--surface)); }
.empty h3 { color: var(--fg); margin-bottom: 6px; font-size: 22px; }

/* আর্টিকেল */
.article { display: grid; gap: 4px; align-content: start; }
.article h3 { margin-top: 6px; }

/* নোটিশ */
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 20px; display: grid; gap: 4px; margin-bottom: 12px; box-shadow: var(--shadow); }
.notice h3 { font-size: 20px; margin: 0; }
.notice p { margin: 0; color: var(--muted); }
.notice.pinned { background: linear-gradient(135deg, color-mix(in srgb, var(--amber) 22%, var(--surface)), color-mix(in srgb, var(--coral) 14%, var(--surface))); border-color: color-mix(in srgb, var(--amber) 60%, transparent); }
a.notice-link { text-decoration: none; display: block; }
a.notice-link:hover .notice { border-color: var(--c, var(--amber)); }
h3.month { font-size: 20px; margin: 22px 0 10px; color: var(--accent-ink); }

.banner { display: grid; gap: 2px; color: #FFFFFF; border-radius: 20px; padding: 16px 22px; margin-bottom: 30px; background: linear-gradient(120deg, #6C4DF2, #E0399A 60%, #F2574B); box-shadow: 0 18px 40px rgba(108, 77, 242, .35); }
.banner b { font-size: 21px; }
.banner span { font-size: 16px; opacity: .95; }

/* ---------- ফুটার ---------- */
.site-footer { color: var(--hdr-muted); font-size: 16px; background: radial-gradient(700px 200px at 80% 0%, rgba(108, 77, 242, .35), transparent 60%), linear-gradient(180deg, #0A1D33, #071526); }
.site-footer .wrap { padding-block: 30px; display: grid; gap: 8px; }
.site-footer a { color: #FFFFFF; }
.site-footer .links { display: flex; flex-wrap: wrap; gap: 6px 18px; }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .orb { animation: none; } .tile, .btn, .filters button { transition: none; } }
@media (max-width: 560px) {
  body { font-size: 17px; }
  .orbit { right: -230px; top: -110px; }
  .post { grid-template-columns: 1fr; }
  .datetile { width: auto; height: auto; grid-auto-flow: column; justify-content: start; align-items: baseline; gap: 8px; padding: 6px 16px; border-radius: 14px; width: fit-content; }
  .datetile b { font-size: 24px; }
  details.qa .ans { padding-left: 0; }
  .tile { min-height: 140px; }
}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div id="root" data-page="notice"></div>
<script>
/* ============================================================
   বিজ্ঞান ভাইয়া: সব লেখা এই ফাইলে। এটি পুরোপুরি অনলাইন সাইট।
   শুরুর দিন: ১০ ডিসেম্বর ২০২৬ (বৃহস্পতিবার)।

   নিয়ম: যেকোনো লেখার তারিখ (YYYY-MM-DD) আজকের তারিখের পরে হলে সেটি সাইটে লুকিয়ে থাকে,
   তারিখ এলে নিজে থেকেই দেখা যায়। তাই সব লেখা আগে থেকেই বসিয়ে রাখা যায়।
   আগে থেকে দেখতে চাইলে ঠিকানার শেষে #preview যোগ করো।

   যেখানে যা বদলাবে:

    { date: "2027-01-01", title: "নতুন বছরের শুভেচ্ছা",
      text: "২০২৭ সালেও প্রতিদিন নতুন বিজ্ঞান আসবে। সবাইকে শুভ নববর্ষ।" },
    { date: "2027-01-08", title: "প্রথম ৩০ দিন পূর্ণ",
      text: "সবাইকে ধন্যবাদ। তোমাদের প্রশ্ন ও লেখা পাঠানো চালিয়ে যাও, আমরা শেখা চালিয়ে যাব।" }
  ]
};

</script>
<script>
/* বিজ্ঞান ভাইয়া: পাতা তৈরির কোড। লেখা বদলাতে চাইলে শুধু data.js বদলালেই হবে। */
(function () {
  var S = window.SITE;
  var root = document.getElementById('root');
  var page = root.getAttribute('data-page');

  var MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
  var DAYS = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
  var DIG = '০১২৩৪৫৬৭৮৯';
  function bn(n) { return String(n).replace(/\d/g, function (d) { return DIG[d]; }); }
  function date(iso) { var p = iso.split('-'); return bn(parseInt(p[2], 10)) + ' ' + MONTHS[parseInt(p[1], 10) - 1] + ' ' + bn(p[0]); }
  function dayName(iso) { return DAYS[new Date(iso + 'T00:00:00').getDay()]; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function byDateDesc(a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }
  function paras(arr) { return (arr || []).map(function (t) { return '<p>' + esc(t) + '</p>'; }).join(''); }
  function link(url, label, cls) { return url ? '<a class="btn ' + (cls || '') + '" href="' + esc(url) + '" target="_blank" rel="noopener">' + label + '</a>' : ''; }

  /* আজকের তারিখ: ভবিষ্যতের লেখা লুকানো থাকে, #preview দিলে সব দেখা যায় */
  var now = new Date();
  var todayISO = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);
  var preview = location.hash === '#preview';
  function visible(p) { return preview || p.date <= todayISO; }
  function daysUntil(iso) { return Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO + 'T00:00:00')) / 86400000); }

  var daily = S.daily.filter(visible).sort(byDateDesc);
  var qa = S.qa.filter(visible).sort(byDateDesc);
  var articles = S.articles.filter(visible).sort(byDateDesc);
  var notices = S.notices.filter(visible);

  var NAV = [
    ['index', 'index.html', 'হোম', 'c-amber'],
    ['rojkar', 'rojkar.html', 'রোজকার বিজ্ঞান', 'c-sky'],
    ['question', 'question.html', 'প্রশ্ন', 'c-violet'],
    ['article', 'article.html', 'আর্টিকেল', 'c-teal'],
    ['notice', 'notice-board.html', 'নোটিশ বোর্ড', 'c-coral']
  ];

  var ORBIT = '<svg class="orbit" viewBox="0 0 200 200" fill="none" stroke-width="1.2" aria-hidden="true"><ellipse cx="100" cy="100" rx="92" ry="32" stroke="#FFB020" stroke-opacity=".7"/><ellipse cx="100" cy="100" rx="92" ry="32" transform="rotate(60 100 100)" stroke="#4FE3D2" stroke-opacity=".7"/><ellipse cx="100" cy="100" rx="92" ry="32" transform="rotate(120 100 100)" stroke="#FF6FA8" stroke-opacity=".7"/><circle cx="100" cy="100" r="10" fill="#FFB020" stroke="none"/><circle cx="188" cy="86" r="4" fill="#4FE3D2" stroke="none"/><circle cx="54" cy="20" r="4" fill="#FF6FA8" stroke="none"/></svg>';
  var ORBS = '<i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i>';
  var TAGC = { 'পদার্থবিজ্ঞান': 'sky', 'রসায়ন': 'violet', 'জীববিজ্ঞান': 'teal', 'জানো কি?': 'amber', 'কেন?': 'coral', 'ঘরে করি': 'teal', 'পরীক্ষা': 'teal', 'বিজ্ঞানী': 'violet', 'খেলা': 'violet', 'চ্যালেঞ্জ': 'pink', 'শুভেচ্ছা': 'pink', 'পরিচিতি': 'amber', 'PDF': 'coral' };
  var PALETTE = ['sky', 'violet', 'teal', 'amber', 'coral', 'pink'];
  function tagColor(tag) {
    if (TAGC[tag]) return 'c-' + TAGC[tag];
    var h = 0; String(tag || '').split('').forEach(function (ch) { h = (h * 31 + ch.charCodeAt(0)) % 997; });
    return 'c-' + PALETTE[h % PALETTE.length];
  }
  var TYPEC = { 'নোটিশ': 'c-amber', 'রোজকার বিজ্ঞান': 'c-sky', 'প্রশ্ন': 'c-violet', 'আর্টিকেল': 'c-teal' };
  function head(kicker, title, sub, cls) { return '<div class="page-head ' + cls + '"><span class="kicker">' + kicker + '</span><h1 class="page-title">' + title + '</h1><p class="page-sub">' + sub + '</p></div>'; }
  var IC = {
    sun: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
    q: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.2 9.3a2.9 2.9 0 1 1 4.2 2.6c-.9.5-1.4 1-1.4 2"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg>',
    pen: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4.2-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20z"/><path d="M14.5 6.5l3 3"/></svg>',
    bell: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>'
  };

  function header() {
    var nav = NAV.map(function (n) {
      return '<a class="' + n[3] + '" href="' + n[1] + '"' + (n[0] === page ? ' aria-current="page"' : '') + '><i></i>' + n[2] + '</a>';
    }).join('');
    var lines = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>';
    return '<header class="site-header bleed"><div class="wrap">' +
      '<a class="brand" href="index.html"><span class="mark" aria-hidden="true">?</span><span class="name">' + esc(S.name) + '</span></a>' +
      '<div class="hdr-actions"><button class="theme-btn" id="themeBtn" type="button" aria-label="থিম বদলাও">◐</button>' +
      '<button class="menu-btn" id="menuBtn" type="button" aria-label="মেনু" aria-expanded="false" aria-controls="menu">' + lines + '</button></div></div>' +
      '<nav class="menu" id="menu" aria-label="মূল মেনু" hidden><div class="wrap menu-in">' + nav + '</div></nav></header>';
  }

  function footer() {
    var l = S.links;
    return '<footer class="site-footer bleed"><div class="wrap">' +
      '<div><b>' + esc(S.name) + '</b> · প্রতিদিন নতুন বিজ্ঞান</div>' +
      '<div class="links">' +
      (l.questionForm ? '<a href="' + esc(l.questionForm) + '" target="_blank" rel="noopener">প্রশ্ন পাঠাও</a>' : '') +
      (l.articleForm ? '<a href="' + esc(l.articleForm) + '" target="_blank" rel="noopener">আর্টিকেল পাঠাও</a>' : '') +
      (l.instagram ? '<a href="' + esc(l.instagram) + '" target="_blank" rel="noopener">ইনস্টাগ্রাম</a>' : '') +
      (l.facebook ? '<a href="' + esc(l.facebook) + '" target="_blank" rel="noopener">ফেসবুক</a>' : '') +
      (l.clubSite ? '<a href="' + esc(l.clubSite) + '" target="_blank" rel="noopener">ক্লাব ওয়েবসাইট</a>' : '') +
      '<span>ইমেইল: <b>' + esc(S.email) + '</b></span></div>' +
      '</div></footer>';
  }

  function emptyBox(title, text) { return '<div class="empty"><h3>' + title + '</h3><p>' + text + '</p></div>'; }
  function soon() { return emptyBox('প্রথম লেখা আসছে ' + date(S.launch), 'তারিখ এলে নিজে থেকেই এখানে দেখা যাবে।'); }

  /* ---------- রোজকার বিজ্ঞান ---------- */
  function dailyCard(p, big) {
    var c = tagColor(p.tag);
    var tryIt = p.tryIt ? '<div class="try"><b>নিজে করে দেখো:</b> ' + esc(p.tryIt) + '</div>' : '';
    var dd = p.date.split('-');
    if (big) {
      return '<article class="today ' + c + '"><div class="today-in"><div class="meta"><span class="chip solid">' + esc(p.tag) + '</span><span class="mono">' + date(p.date) + ', ' + dayName(p.date) + '</span></div>' +
        '<h2>' + esc(p.title) + '</h2>' + paras(p.body) + tryIt + '</div></article>';
    }
    return '<article class="post ' + c + '"><div class="datetile"><b class="mono">' + bn(parseInt(dd[2], 10)) + '</b><span>' + MONTHS[parseInt(dd[1], 10) - 1] + '</span></div>' +
      '<div class="body"><div class="meta"><span class="chip">' + esc(p.tag) + '</span><span>' + dayName(p.date) + '</span></div><h3>' + esc(p.title) + '</h3>' + paras(p.body) + tryIt + '</div></article>';
  }

  /* ---------- আর্টিকেল ---------- */
  function articleCard(a) {
    var byVaiya = a.kind !== 'student';
    var who = byVaiya ? '<span class="chip solid c-amber">বিজ্ঞান ভাইয়া</span>' :
      '<span class="chip solid c-pink">' + esc(a.author) + (a.cls ? ' · ' + esc(a.cls) + ' শ্রেণি' : '') + '</span>';
    var extra = '';
    if (a.materials && a.materials.length) extra += '<b>যা লাগবে</b><ul class="plain">' + a.materials.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>';
    if (a.steps && a.steps.length) extra += '<b>যেভাবে করবে</b><ol class="steps">' + a.steps.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ol>';
    if (a.why) extra += '<div class="try"><b>কেন এমন হয়?</b> ' + esc(a.why) + '</div>';
    if (a.safety) extra += '<p class="safety" style="margin-top:12px">সাবধানতা: ' + esc(a.safety) + '</p>';
    if (a.pdf) extra += '<div class="actions" style="margin-top:6px"><a class="btn" href="' + esc(a.pdf) + '" target="_blank" rel="noopener">PDF খোলো</a></div>';
    return '<article class="card article ' + tagColor(a.tag) + '" style="border-top:5px solid var(--c)" data-kind="' + (byVaiya ? 'vaiya' : 'student') + '">' +
      '<div class="meta">' + who + '<span class="chip">' + esc(a.tag) + '</span><span class="mono">' + date(a.date) + '</span></div>' +
      '<h3>' + esc(a.title) + '</h3>' + paras(a.body) + extra + '</article>';
  }

  /* ---------- নোটিশ ---------- */
  function allNotices() {
    var items = [];
    notices.forEach(function (n) { items.push({ date: n.date, pin: !!n.pin, type: 'নোটিশ', title: n.title, text: n.text, href: '' }); });
    daily.forEach(function (p) { items.push({ date: p.date, type: 'রোজকার বিজ্ঞান', title: 'আজকের বিজ্ঞান: ' + p.title, text: '', href: 'rojkar.html' }); });
    qa.forEach(function (x) { items.push({ date: x.date, type: 'প্রশ্ন', title: 'নতুন উত্তর: ' + x.q, text: '', href: 'question.html' }); });
    articles.forEach(function (a) {
      items.push({ date: a.date, type: 'আর্টিকেল', title: 'নতুন লেখা: ' + a.title, text: (a.kind === 'student' ? 'লেখক: ' + a.author : 'লেখক: বিজ্ঞান ভাইয়া'), href: 'article.html' });
    });
    return items;
  }
  function noticeRow(n) {
    var t = '<div class="notice ' + (TYPEC[n.type] || 'c-amber') + (n.pin ? ' pinned' : '') + '" style="border-left:6px solid var(--c)"><div class="meta"><span class="chip">' + n.type + '</span>' + (n.pin ? '<span class="chip solid c-amber">📌 আটকানো</span>' : '') + '<span class="mono">' + date(n.date) + '</span></div>' +
      '<h3>' + esc(n.title) + '</h3>' + (n.text ? '<p>' + esc(n.text) + '</p>' : '') + '</div>';
    return n.href ? '<a class="notice-link" href="' + n.href + '">' + t + '</a>' : t;
  }

  /* ---------- হোম ---------- */
  function pageIndex() {
    var latest = daily[0];
    var d = daysUntil(S.launch);
    var banner = d > 0 && !preview ?
      '<div class="banner"><b>শুরু হচ্ছে ' + date(S.launch) + ' (' + dayName(S.launch) + ')</b><span>আর ' + bn(d) + ' দিন বাকি। প্রতিদিন একটি করে নতুন বিজ্ঞান আসবে।</span></div>' : '';
    var tiles = [
      ['rojkar.html', daily.length, 'রোজকার বিজ্ঞান', 'প্রতিদিনের নতুন তথ্য'],
      ['question.html', qa.length, 'প্রশ্ন', 'তোমাদের প্রশ্নের উত্তর'],
      ['article.html', articles.length, 'আর্টিকেল', 'ভাইয়ার ও তোমাদের লেখা'],
      ['notice-board.html', allNotices().length, 'নোটিশ বোর্ড', 'প্রতিদিনের সব খবর']
    ].map(function (t, k) {
      return '<a class="card tile ' + ['c-sky', 'c-violet', 'c-teal', 'c-coral'][k] + '" href="' + t[0] + '">' + IC[['sun', 'q', 'pen', 'bell'][k]] + '<span class="num mono">' + bn(t[1]) + '</span><span class="lbl">' + t[2] + '</span><span class="hint">' + t[3] + '</span></a>';
    }).join('');
    var recentNotices = allNotices().sort(function (a, b) { return (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || byDateDesc(a, b); }).slice(0, 4).map(noticeRow).join('');
    var recentArticles = articles.slice(0, 3).map(articleCard).join('');
    return '<section class="hero bleed">' + ORBIT + ORBS + '<div class="wrap">' +
      '<div class="eyebrow">✦ প্রতিদিন নতুন বিজ্ঞান</div>' +
      '<h1>' + esc(S.name) + '</h1><p class="lead">' + esc(S.tagline) + '</p>' +
      '<div class="actions">' + link(S.links.questionForm, 'প্রশ্ন পাঠাও') + '<a class="btn ghost" href="rojkar.html">রোজকার বিজ্ঞান দেখো</a></div></div></section>' +
      '<main class="wrap">' + banner +
      '<section class="section" style="margin-top:0"><h2>আজকের বিজ্ঞান</h2>' + (latest ? dailyCard(latest, true) : soon()) + '</section>' +
      '<section class="section"><h2>সব বিভাগ</h2><div class="grid tiles">' + tiles + '</div></section>' +
      '<section class="section"><div class="head-row"><h2>নোটিশ বোর্ড</h2><a href="notice-board.html">সব দেখো</a></div><div class="list">' + (recentNotices || soon()) + '</div></section>' +
      (recentArticles ? '<section class="section"><div class="head-row"><h2>নতুন আর্টিকেল</h2><a href="article.html">সব দেখো</a></div><div class="list">' + recentArticles + '</div></section>' : '') +
      '</main>';
  }

  /* ---------- রোজকার বিজ্ঞান ---------- */
  function pageRojkar() {
    var tags = [];
    daily.forEach(function (p) { if (tags.indexOf(p.tag) < 0) tags.push(p.tag); });
    return '<main class="wrap">' + head('DAILY SCIENCE', 'রোজকার বিজ্ঞান', 'প্রতিদিন একটি করে নতুন বিজ্ঞানের তথ্য। সবচেয়ে নতুনটি সবার ওপরে।', 'c-sky') +
      '<div class="toolbar"><input class="search" id="q" type="search" placeholder="খুঁজে দেখো" aria-label="খুঁজো">' +
      '<div class="filters" id="filters"><button type="button" data-tag="" aria-pressed="true">সব</button>' +
      tags.map(function (t) { return '<button type="button" data-tag="' + esc(t) + '" aria-pressed="false">' + esc(t) + '</button>'; }).join('') +
      '</div></div><div class="list" id="out"></div></main>';
  }
  function wireRojkar() {
    var tag = '', q = '';
    var out = document.getElementById('out');
    function draw() {
      var list = daily.filter(function (p) { return (!tag || p.tag === tag) && (!q || (p.title + ' ' + p.body.join(' ')).indexOf(q) >= 0); });
      out.innerHTML = list.length ? list.map(function (p) { return dailyCard(p, false); }).join('') : (daily.length ? emptyBox('কিছু পাওয়া যায়নি', 'অন্য শব্দ দিয়ে খুঁজে দেখো।') : soon());
    }
    document.getElementById('q').addEventListener('input', function (e) { q = e.target.value.trim(); draw(); });
    document.getElementById('filters').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      tag = b.getAttribute('data-tag');
      Array.prototype.forEach.call(document.querySelectorAll('#filters button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      draw();
    });
    draw();
  }

  /* ---------- প্রশ্ন ---------- */
  function pageQuestion() {
    return '<main class="wrap">' + head('Q &amp; A', 'প্রশ্ন ও উত্তর', 'বিজ্ঞান নিয়ে তোমার যেকোনো প্রশ্ন নিচের বোতামে ক্লিক করে পাঠাও। বাছাই করা প্রশ্নের উত্তর এখানে জমা হবে।', 'c-violet') +
      '<div class="actions" style="margin:0 0 18px">' + (link(S.links.questionForm, 'প্রশ্ন পাঠাও') || '<span class="chip">ফর্ম শীঘ্রই আসছে</span>') + '</div>' +
      '<div class="toolbar"><input class="search" id="q" type="search" placeholder="প্রশ্ন খুঁজো" aria-label="প্রশ্ন খুঁজো"></div>' +
      '<div id="out"></div></main>';
  }
  function wireQuestion() {
    var out = document.getElementById('out');
    function draw(q) {
      var list = qa.filter(function (x) { return !q || (x.q + ' ' + x.a).indexOf(q) >= 0; });
      out.innerHTML = list.length ? list.map(function (x) {
        return '<details class="qa"><summary>' + esc(x.q) + '</summary><div class="ans">' + esc(x.a) +
          '<div class="meta" style="margin-top:8px">' + date(x.date) + (x.askedBy ? ' · জিজ্ঞাসা করেছে: ' + esc(x.askedBy) : '') + ' · উত্তর দিয়েছে: বিজ্ঞান ভাইয়া</div></div></details>';
      }).join('') : (qa.length ? emptyBox('কিছু পাওয়া যায়নি', 'অন্য শব্দ দিয়ে খুঁজে দেখো, বা নিজের প্রশ্ন পাঠাও।') : soon());
    }
    document.getElementById('q').addEventListener('input', function (e) { draw(e.target.value.trim()); });
    draw('');
  }

  /* ---------- আর্টিকেল ---------- */
  function pageArticle() {
    return '<main class="wrap">' + head('ARTICLES', 'আর্টিকেল', 'বিজ্ঞান ভাইয়ার লেখা আসে "বিজ্ঞান ভাইয়া" নামে। তোমাদের পাঠানো নির্বাচিত লেখা ছাপা হয় তোমাদের নিজের নামে।', 'c-teal') +
      '<div class="actions" style="margin:0 0 18px">' + (link(S.links.articleForm, 'নিজের লেখা পাঠাও') || '<span class="chip">লেখা পাঠানোর ফর্ম শীঘ্রই আসছে</span>') + '</div>' +
      '<div class="toolbar"><div class="filters" id="filters">' +
      '<button type="button" data-kind="" aria-pressed="true">সব</button>' +
      '<button type="button" data-kind="vaiya" aria-pressed="false">বিজ্ঞান ভাইয়ার লেখা</button>' +
      '<button type="button" data-kind="student" aria-pressed="false">তোমাদের লেখা</button></div></div>' +
      '<div class="grid" id="out" style="grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr))"></div></main>';
  }
  function wireArticle() {
    var kind = '';
    var out = document.getElementById('out');
    function draw() {
      var list = articles.filter(function (a) { return !kind || (a.kind === 'student' ? 'student' : 'vaiya') === kind; });
      var html = list.map(articleCard).join('');
      if (!html) html = kind === 'student' || !articles.length ? emptyBox('এখানে এখনো কোনো লেখা নেই', 'প্রথম লেখাটি তোমার হতে পারে। ফর্মে নিজের লেখা পাঠাও।') : soon();
      else if (kind === 'student' || kind === '') { /* তোমাদের লেখা না থাকলে নিচে একটি আমন্ত্রণ */
        var hasStudent = list.some(function (a) { return a.kind === 'student'; });
        if (!hasStudent) html += '<div style="grid-column:1/-1">' + emptyBox('তোমাদের লেখা এখানে ছাপা হবে', 'নির্বাচিত লেখা তোমার নিজের নামে এখানে আসবে। প্রথম লেখাটি তোমার হতে পারে।') + '</div>';
      }
      out.innerHTML = html;
    }
    document.getElementById('filters').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      kind = b.getAttribute('data-kind');
      Array.prototype.forEach.call(document.querySelectorAll('#filters button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      draw();
    });
    draw();
  }

  /* ---------- নোটিশ বোর্ড ---------- */
  function pageNotice() {
    var types = ['নোটিশ', 'রোজকার বিজ্ঞান', 'প্রশ্ন', 'আর্টিকেল'];
    return '<main class="wrap">' + head('NOTICE BOARD', 'নোটিশ বোর্ড', 'প্রতিদিনের সব খবর এখানে। নতুন বিজ্ঞান, নতুন উত্তর, নতুন লেখা ও দরকারি ঘোষণা, সবই।', 'c-coral') +
      '<div class="toolbar"><div class="filters" id="filters"><button type="button" data-type="" aria-pressed="true">সব</button>' +
      types.map(function (t) { return '<button type="button" data-type="' + t + '" aria-pressed="false">' + t + '</button>'; }).join('') +
      '</div></div><div id="out"></div></main>';
  }
  function wireNotice() {
    var type = '';
    var out = document.getElementById('out');
    function draw() {
      var items = allNotices().filter(function (n) { return !type || n.type === type; });
      if (!items.length) { out.innerHTML = soon(); return; }
      var pinned = items.filter(function (n) { return n.pin; });
      var rest = items.filter(function (n) { return !n.pin; }).sort(function (a, b) { return byDateDesc(a, b); });
      var html = pinned.map(noticeRow).join('');
      var last = '';
      rest.forEach(function (n) {
        if (n.date !== last) { html += '<h3 class="month">' + date(n.date) + ' · ' + dayName(n.date) + '</h3>'; last = n.date; }
        html += noticeRow(n);
      });
      out.innerHTML = html;
    }
    document.getElementById('filters').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      type = b.getAttribute('data-type');
      Array.prototype.forEach.call(document.querySelectorAll('#filters button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      draw();
    });
    draw();
  }

  var PAGES = { index: pageIndex, rojkar: pageRojkar, question: pageQuestion, article: pageArticle, notice: pageNotice };
  var WIRE = { rojkar: wireRojkar, question: wireQuestion, article: wireArticle, notice: wireNotice };

  root.innerHTML = header() + (PAGES[page] || pageIndex)() + footer();
  if (WIRE[page]) WIRE[page]();

  /* তিন দাগের মেনু */
  var menuBtn = document.getElementById('menuBtn'), menu = document.getElementById('menu');
  function setMenu(open) { menu.hidden = !open; menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  menuBtn.addEventListener('click', function (e) { e.stopPropagation(); setMenu(menu.hidden); });
  document.addEventListener('click', function (e) { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !menu.hidden) { setMenu(false); menuBtn.focus(); } });

  /* থিম বদল (শুধু এই ব্রাউজারে মনে থাকে) */
  var de = document.documentElement;
  try { var saved = localStorage.getItem('bv-theme'); if (saved) de.setAttribute('data-theme', saved); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var cur = de.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    de.setAttribute('data-theme', next);
    try { localStorage.setItem('bv-theme', next); } catch (e) {}
  });
})();

</script>
</body>
</html>
